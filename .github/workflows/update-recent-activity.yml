name: Update recent activity

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: update-recent-activity
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare verified public activity
        id: activity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { prepareRecentActivity } = require('./.github/scripts/update-recent-activity.cjs');
            await prepareRecentActivity({ github, context, core });

      - name: Set up Node.js
        if: ${{ steps.activity.outputs.changed == 'true' && steps.activity.outputs.has_activity == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        if: ${{ steps.activity.outputs.changed == 'true' && steps.activity.outputs.has_activity == 'true' }}
        run: |
          if ! npm install --global @github/copilot@1.0.78; then
            echo "::warning::Copilot CLI installation failed; the deterministic fallback will be used."
          fi

      - name: Generate activity text with Copilot
        if: ${{ steps.activity.outputs.changed == 'true' && steps.activity.outputs.has_activity == 'true' }}
        working-directory: ${{ runner.temp }}
        env:
          ACTIVITY_PROMPT_BASE64: ${{ steps.activity.outputs.prompt }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          prompt="$(printf '%s' "$ACTIVITY_PROMPT_BASE64" | base64 --decode)"
          if command -v copilot >/dev/null && timeout 90s copilot -p "$prompt" -s --no-ask-user > recent-activity-generated.json; then
            echo "Copilot generated the activity presentation."
          else
            printf '' > recent-activity-generated.json
            echo "::warning::Copilot generation failed; the deterministic fallback will be used."
          fi

      - name: Update README
        if: ${{ always() && steps.activity.outputs.changed == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACTIVITY_FACTS_BASE64: ${{ steps.activity.outputs.facts }}
          ACTIVITY_FINGERPRINT: ${{ steps.activity.outputs.fingerprint }}
          GENERATED_ACTIVITY_PATH: ${{ runner.temp }}/recent-activity-generated.json
        with:
          script: |
            const { updateRecentActivity } = require('./.github/scripts/update-recent-activity.cjs');
            await updateRecentActivity({
              github,
              context,
              core,
              factsBase64: process.env.ACTIVITY_FACTS_BASE64,
              fingerprint: process.env.ACTIVITY_FINGERPRINT,
              generatedPath: process.env.GENERATED_ACTIVITY_PATH,
            });
